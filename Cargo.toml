[workspace]
members = [".", "admin"]
exclude = ["example-app"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/StaringSkyward/pg_task_scheduler"

[package]
name = "pg_task_scheduler"
version = "0.1.0"
description = "Embeddable PostgreSQL task queue for Diesel, diesel-async and Tokio"
keywords = ["queue", "postgres", "jobs", "diesel", "scheduler"]
categories = ["asynchronous", "database"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["src", "migrations", "README.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
diesel = { version = "2.3.14", default-features = false, features = ["postgres_backend", "uuid", "chrono", "serde_json", "32-column-tables"] }
diesel-async = { version = "0.9", features = ["postgres"] }
diesel-derive-newtype = "2"
croner = { version = "2", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
metrics = "0.24"
thiserror = "2"
tokio-util = "0.7"
futures = "0.3"

[features]
default = ["deadpool"]
deadpool = ["diesel-async/deadpool"]
bb8 = ["diesel-async/bb8"]
mobc = ["diesel-async/mobc"]
cron = ["dep:croner"]

[dev-dependencies]
dotenvy = "0.15.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
