{% extends "base.html" %}
{% block title %}Bulk result{% endblock %}
{% block content %}
<section class="panel" data-busy>
<h2>Bulk result</h2>
<div class="body">
<p id="bulk-result">{{ affected }} {{ verb }}</p>
{% if more %}
<p>More tasks match.</p>
<form class="continue" method="post" action="{{ base }}/bulk">
  <input type="hidden" name="action" value="{{ p.action }}">
  <input type="hidden" name="task_name" value="{{ p.task_name }}">
  <input type="hidden" name="queue" value="{{ p.queue }}">
  <input type="hidden" name="error" value="{{ p.error }}">
  <input type="hidden" name="confirm_name" value="{{ p.confirm_name }}">
  <input type="hidden" name="reason" value="{{ p.reason }}">
  <button type="submit">Continue</button>
</form>
{% endif %}
<p><a href="{{ base }}/overview">Back to overview</a></p>
</div>
</section>
{% endblock %}
