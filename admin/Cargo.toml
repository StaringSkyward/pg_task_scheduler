[package]
name = "pg_task_scheduler_admin"
version = "0.1.0"
edition = "2024"

[features]
default = ["deadpool"]
deadpool = ["pg_task_scheduler/deadpool"]
cron = ["pg_task_scheduler/cron"]

[dependencies]
pg_task_scheduler = { path = "..", version = "0.1.0", default-features = false }
argon2 = "=0.6.0"
axum = "0.7"
base64 = "=0.22.1"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
diesel = { version = "2.3", default-features = false, features = ["postgres_backend"] }
diesel-async = { version = "0.9", features = ["postgres"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
diesel = { version = "2.3", default-features = false, features = ["postgres_backend", "uuid", "chrono"] }
diesel-async = { version = "0.9", features = ["postgres", "deadpool"] }
dotenvy = "0.15.7"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
